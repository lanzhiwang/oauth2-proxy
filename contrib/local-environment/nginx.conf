# 这段配置实现了一个"前向认证"(Forward Authentication)架构.
# 它使用了 Nginx 自带的 auth_request 模块和开源组件 oauth2-proxy, 将你的业务服务(这里是 httpbin)保护在 OAuth2 认证体系(比如 Google, GitHub, Keycloak 等)之后.
# 业务服务本身不需要编写任何登录逻辑, 由 Nginx 充当了身份感知代理(Identity-Aware Proxy)的角色.

# Reverse proxy to httpbin
server {
  # 基础 Server 配置
  # 含义: Nginx 监听 8080 端口, 处理域名为 oauth2-proxy.localtest.me 的请求.
  # 补充: localtest.me 是一个互联网上公开的泛域名, 它所有的子域名都直接解析到 127.0.0.1, 非常适合本地开发和测试.
  listen      8080;
  server_name oauth2-proxy.localtest.me;

  # OAuth2 原生路由映射
  # 含义: 处理所有以 /oauth2/ 开头的请求, 并将它们直接反向代理给后端的 oauth2-proxy 容器(端口 4180).
  # 作用: oauth2-proxy 自身需要处理一些特定的端点, 例如 /oauth2/sign_in (登录页)、/oauth2/callback (OAuth 提供商跳回的地址)、/oauth2/sign_out (登出).
  # Header说明: 将客户端的真实 IP 和请求的 URI 传递给 oauth2-proxy, 尤其是 X-Auth-Request-Redirect, 它告诉 oauth2-proxy 用户登录成功后应该重定向回哪个原本的业务页面.
  location /oauth2/ {
    proxy_pass       http://oauth2-proxy:4180;
    proxy_set_header Host                    $host;
    proxy_set_header X-Real-IP               $remote_addr;
    proxy_set_header X-Forwarded-Uri         $request_uri;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
  }

  # 核心认证子请求端点 (The Gatekeeper)
  # 含义: 精确匹配 /oauth2/auth 路径. 这是专门给 Nginx 内部的 auth_request 模块调用的接口, 对外不直接暴露.
  # 作用: 它像一个"门卫". Nginx 会询问 oauth2-proxy: "这个用户的 Cookie/Token 还有效吗?". 如果 oauth2-proxy 返回 202 Accepted 或 200 OK, Nginx 就放行; 如果返回 401 Unauthorized, Nginx 就拦截.
  # 高级运维细节:
  # proxy_pass_request_body off; 和 Content-Length ""; 是极其关键的性能和逻辑优化.
  # 因为验证身份只需要查验 HTTP Header(如 Cookie 或 Authorization Token), 完全不需要把用户上传的 Body(例如一个几百MB的文件或者表单数据)发给认证中心.
  # 关闭它可以节省大量的网络带宽和内存开销.
  location = /oauth2/auth {
    proxy_pass       http://oauth2-proxy:4180;
    proxy_set_header Host             $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-Uri  $request_uri;
    # nginx auth_request includes headers but not body
    proxy_set_header Content-Length   "";
    proxy_pass_request_body           off;
  }

  # 受保护的业务路由 (拦截与鉴权)
  # 这是整段配置的灵魂所在.
  # auth_request /oauth2/auth;: 核心拦截器. 当任何请求进入 / 时, Nginx 会先暂停处理, 向 /oauth2/auth 发起一个内部子请求.
  # error_page 401 = @oauth2_signin;: 如果子请求返回 401(未登录), Nginx 会捕获这个错误, 并将请求交接给内部命名的 location @oauth2_signin 去处理.
  # 变量提取与头部注入 (auth_request_set & proxy_set_header):
  # 背景知识: 在 Nginx 中, 子请求的响应头会被映射为 $upstream_http_<header_name> 的形式(全小写, 横杠变下划线).
  # 如果认证成功, oauth2-proxy 会在响应中注入包含用户身份的 Header(前提是 oauth2-proxy 启动时带了 --set-xauthrequest 参数).
  # 这里把 oauth2-proxy 返回的 X-Auth-Request-User 和 X-Auth-Request-Email 提取出来, 存入 Nginx 变量 $user 和 $email 中.
  # 随后, Nginx 在发往真正业务后端 (httpbin) 的请求中, 注入 X-User 和 X-Email.
  # 结果: 后端的 httpbin (或你的 Spring Boot / Node.js 代码)可以直接从 Header 里读取 X-Email 拿到当前登录用户的邮箱, 无需在业务代码里引入任何鉴权 SDK!
  # 这就是无代码侵入的单点登录(SSO).
  # proxy_pass http://httpbin/;: 认证通过后, 真正的业务请求被转发给 httpbin.
  location / {
    auth_request /oauth2/auth;
    error_page 401 = @oauth2_signin;

    # pass information via X-User and X-Email headers to backend,
    # requires running with --set-xauthrequest flag
    auth_request_set $user   $upstream_http_x_auth_request_user;
    auth_request_set $email  $upstream_http_x_auth_request_email;
    proxy_set_header X-User  $user;
    proxy_set_header X-Email $email;

    proxy_pass http://httpbin/;
    # or "root /path/to/site;" or "fastcgi_pass ..." etc
  }

  # 登录重定向处理器
  # 含义: 定义一个名为 @oauth2_signin 的内部 location, 专门处理 401 未授权错误.
  # 作用: 强制让用户的浏览器 HTTP 302 重定向到登录页面 /oauth2/sign_in.
  # 细节: 带上了 rd (redirect) 参数.
  # 它拼装了 $scheme://$http_host$request_uri(例如 http://oauth2-proxy.localtest.me/some/api).
  # 这确保了用户在完成复杂的 OAuth2 登录跳回后, 还能被精准送回他们最初想要访问的那个页面, 提升了极佳的用户体验.
  # Named location for handling OAuth2 sign-in redirects
  # This ensures the browser receives a proper 302 redirect that it will follow
  location @oauth2_signin {
    return 302 /oauth2/sign_in?rd=$scheme://$http_host$request_uri;
  }
}

# 总结: 请求的生命周期 (Request Flow)
# 为了让你彻底弄懂, 我们模拟一个小白用户访问的过程:
#
# 场景 1: 未登录的用户访问 http://.../api/data
# 用户请求到达 location /.
# Nginx 触发 auth_request, 悄悄发起内部请求到 /oauth2/auth.
# oauth2-proxy 发现没有合法的 Cookie, 返回 401 Unauthorized.
# Nginx 拦截到 401, 触发 error_page 401 = @oauth2_signin.
# 浏览器收到 302 重定向响应, 跳转到 /oauth2/sign_in?rd=.../api/data.
# 用户在浏览器端完成 SSO 登录.
#
# 场景 2: 已登录的用户访问 http://.../api/data
# 用户请求带着之前的 Cookie 到达 location /.
# Nginx 触发 auth_request 内部请求到 /oauth2/auth.
# oauth2-proxy 校验 Cookie 成功, 返回 200 OK, 并且在 HTTP 响应头里附带 X-Auth-Request-Email: admin@test.com.
# Nginx 放行请求, 使用 auth_request_set 把邮箱存起来, 并通过 proxy_set_header 放到新请求里.
# 后端 httpbin 收到请求, 并在 Header 里看到了 X-Email: admin@test.com. 正常处理并返回业务数据.
